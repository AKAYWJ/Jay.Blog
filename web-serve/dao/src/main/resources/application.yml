server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jayblog?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useSSL=false
    username: jayblog
    password: "jayblog"
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 上传文件大小限制
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  mvc:
    static-path-pattern: /**
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.website.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl